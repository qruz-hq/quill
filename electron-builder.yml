appId: studio.saudad.quill
productName: Quill
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/icons
    to: icons
  - from: resources/whisper
    to: whisper
extraFiles:
  # Plain executable inside Contents/MacOS, NOT a nested .app: this makes the
  # main app the TCC subject, so Microphone/Speech/Accessibility are all
  # granted once, to "Quill".
  - from: resources/FlowSTT.app/Contents/MacOS/flow-stt
    to: MacOS/flow-stt
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    # dmg for people to install, zip because electron-updater reads that feed.
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # Ad-hoc. Without a Developer ID the app is still Gatekeeper-blocked on other
  # Macs, but ad-hoc at least keeps it launchable once quarantine is cleared.
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: "${productName}-${version}-${arch}.${ext}"
  extendInfo:
    NSMicrophoneUsageDescription: Quill needs the microphone to turn your speech into text.
    NSSpeechRecognitionUsageDescription: Quill uses on-device speech recognition to transcribe your dictation.
    LSUIElement: false

publish:
  provider: github
  # owner/repo are read from the git remote when publishing

dmg:
  title: "${productName} ${version}"
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
