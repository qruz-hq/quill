name: CI

# Runs on main and on pull requests into main. A pull request from a fork gets
# a read-only token and no secrets, and waits for a maintainer's approval
# (repo setting) before it starts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon: the Swift helper and whisper's Metal backend are arm64.
          - { os: macos-14, name: macOS, helper: resources/helper/flow-stt }
          - { os: windows-latest, name: Windows, helper: resources/helper/flow-stt.exe }
          # The oldest Ubuntu still supported, so the helper links against an old glibc.
          - { os: ubuntu-22.04, name: Linux, helper: resources/helper/flow-stt }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: latest }

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/helper

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # cmake, a C++ compiler and libclang: whisper.cpp and its bindings.
          # libasound2-dev, libpulse-dev, pkg-config: the audio and volume crates.
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config clang libclang-dev \
            libasound2-dev libpulse-dev

      - name: macOS build tools
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake

      - name: Windows build tools
        if: runner.os == 'Windows'
        run: |
          # cmake and MSVC are on the runner. bindgen needs libclang from LLVM.
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then choco install llvm -y --no-progress; fi
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Helper unit tests (cargo test)
        working-directory: native/helper
        run: cargo test --locked

      - name: Build the Rust helper
        run: bun run helper:build

      - name: Helper conformance (no microphone)
        env:
          HELPER_BIN: ${{ matrix.helper }}
          HELPER_NO_MIC: '1'
          HELPER_EXPECT_CAPS: '1'
        run: bun test tests/helper

      - name: Build the Swift helper
        if: runner.os == 'macOS'
        run: bun run stt:build

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build the Electron app
        run: bun run build

      # The unpacked app, no installer: proves electron-builder.yml and that the
      # helper lands where main looks for it.
      - name: Package (unpacked)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun run package

      # An unsigned Windows installer for testers, kept with the run for a
      # week. SmartScreen warns on it ("More info" then "Run anyway").
      - name: Windows test installer
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun scripts/dist.ts --publish never --skip-typecheck

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        with:
          name: quill-windows-test
          if-no-files-found: error
          retention-days: 7
          path: dist/*.exe

      # The CPU builds (Windows, Linux) decode a real recording: a build that
      # runs but returns garbage (a line of "!", NaN logits) fails here. Last,
      # so the test installer above is still attached when it fails.
      - name: Transcription smoke test (CPU builds)
        if: runner.os != 'macOS'
        run: |
          mkdir -p .models
          for m in tiny.en base.en-q5_1 small-q5_1; do
            curl -sSfL -o ".models/ggml-$m.bin" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$m.bin"
          done
          bun scripts/smoke-transcribe.ts ${{ matrix.helper }} .models/ggml-tiny.en.bin .models/ggml-base.en-q5_1.bin \
            .models/ggml-small-q5_1.bin .models/ggml-small-q5_1.bin,fr
