name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # Apple silicon runner: the Swift helper and whisper's Metal backend are arm64.
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the Swift speech helper
        run: bun run stt:build

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add these secrets to sign and notarise properly. Without them the
          # build is ad-hoc signed and Gatekeeper will block it on other Macs.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset signing secret arrives as an empty string, and
          # electron-builder treats empty CSC_LINK as a certificate path,
          # failing with "not a file". Absent is fine; empty is not.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          bun run release
