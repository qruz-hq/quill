name: Release

on:
  push:
    tags: ['v*']

# Nothing is granted by default: each job asks for what it needs.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS has to build for there to be a release. Windows and Linux are
    # attached when they build; a failure there is shown on the run and does
    # not hold the macOS release back.
    continue-on-error: ${{ !matrix.required }}
    # The signing secrets live in this environment. It only accepts v* tags
    # and waits for a maintainer's approval, so no branch or pull request
    # can reach them.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon runner: the Swift helper and whisper's Metal backend are arm64.
          - { os: macos-14, name: macOS, required: true }
          - { os: windows-latest, name: Windows, required: false }
          - { os: ubuntu-22.04, name: Linux, required: false }
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: latest }

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # No build cache here: a release is built from scratch so that nothing
      # saved by an earlier run can end up in a signed installer.

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config clang libclang-dev \
            libasound2-dev libpulse-dev

      - name: macOS build tools
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake

      - name: Windows build tools
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then choco install llvm -y --no-progress; fi
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the Swift speech helper
        if: runner.os == 'macOS'
        run: bun run stt:build

      - name: Build the Rust helper
        run: bun run helper:build

      - name: Build installers
        env:
          # Add these secrets to sign and notarise properly. Without them the
          # macOS build is ad-hoc signed (Gatekeeper blocks it on other Macs)
          # and the Windows installer is unsigned (SmartScreen warns).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # An unset signing secret arrives as an empty string, and
          # electron-builder treats empty CSC_LINK as a certificate path,
          # failing with "not a file". Absent is fine; empty is not.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # The Apple certificate is for the macOS build only: on Windows
          # electron-builder would try to sign the installer with it.
          if [ "$RUNNER_OS" != "macOS" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          # Nothing is uploaded from here: three jobs publishing at once can
          # each create their own draft. The `draft` job attaches everything.
          bun scripts/dist.ts --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  draft:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          # A tag push releases that tag. A manual run releases the version in
          # package.json, as electron-builder used to.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run adds to its own draft. A release that is already
            # published is never touched from here.
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$tag is already published. Bump the version or delete that release first."
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --title "${tag#v}" --target "$GITHUB_SHA" --generate-notes
          fi
          for os in dmg exe AppImage deb; do
            ls dist/*."$os" >/dev/null 2>&1 || echo "::warning::No .$os in this release: that build failed, see the build jobs."
          done
