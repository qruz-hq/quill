name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quill version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: OS version and hardware
      placeholder: "macOS 15.3, MacBook Air M2"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: On macOS the logs are ~/Library/Logs/Quill-app.log and Quill-stt.log. Check them for anything private before you paste.
      render: text
